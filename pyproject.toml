[project]
name = "engineering-governance"
version = "0.2.0"
description = "Engineering Governance Control Plane for AI-assisted software development"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "pyyaml>=6.0",
    "cryptography>=42",
    "cel-python>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100"]

[project.scripts]
gov = "governance.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/governance"]

[tool.hatch.build.targets.wheel.force-include]
"registry" = "governance/_registry"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
