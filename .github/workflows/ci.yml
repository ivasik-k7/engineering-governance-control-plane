name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOV_REGISTRY: registry
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv venv --python 3.12 && uv pip install -e ".[dev]" ruff pip-audit
      - run: uv run ruff check src tests && uv run ruff format --check src tests
      - run: uv run gov registry lint
      - run: uv run pytest -q
      - run: uv run gov validate --fail-closed
      - run: uv run gov bundle build -o governance-bundle.json
      - uses: actions/upload-artifact@v7
        with:
          name: governance-bundle
          path: governance-bundle.json
