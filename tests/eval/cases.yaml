# Retrieval evaluation: for a project stack, task and environment, which rules must and must not
# be returned by get_applicable_rules. Mandatory rules are never allowed to be missing.
- name: fastapi-authentication-endpoint
  stack: {languages: [python], frameworks: [fastapi]}
  task: Implement a new authentication endpoint in my FastAPI service
  environment: production
  must_include: [SEC-001, SEC-014, SEC-015, QA-008, API-003, PY-012, DOC-006]
  must_exclude: [AWS-001, K8S-001, FE-001, DB-002]

- name: alembic-migration-production
  stack: {languages: [python], frameworks: [fastapi, alembic, postgresql]}
  task: Add an Alembic migration that renames the email column
  environment: production
  must_include: [DB-001, DB-002, SEC-020, ARCH-001]
  must_be_mandatory: [DB-002]
  must_exclude: [SEC-014, QA-008]

- name: alembic-migration-development
  stack: {languages: [python], frameworks: [alembic]}
  task: Add an Alembic migration that renames the email column
  environment: development
  must_include: [DB-002]
  must_not_be_mandatory: [DB-002]
  must_exclude: [SEC-002]

- name: terraform-s3-bucket
  stack: {languages: [terraform], platforms: [aws, terraform]}
  task: Create an S3 bucket for invoice PDFs with Terraform
  environment: production
  must_include: [AWS-001, AWS-002, AWS-003, TF-001, TF-002, SEC-001]
  must_exclude: [SEC-014, PY-012, K8S-001]

- name: kubernetes-deployment
  stack: {languages: [yaml], platforms: [kubernetes]}
  task: Add a Kubernetes deployment for the worker
  environment: staging
  must_include: [K8S-001, K8S-002, K8S-003, SEC-001]
  must_exclude: [AWS-001, PY-005]

- name: react-form
  stack: {languages: [typescript], frameworks: [react]}
  task: Build a signup form component
  environment: production
  must_include: [FE-001, FE-002, SEC-001]
  must_exclude: [PY-012, SEC-020, AWS-001]

- name: python-library-refactor
  stack: {languages: [python]}
  task: Refactor the parser module
  environment: development
  must_include: [SEC-001, PY-005]
  must_exclude: [API-001, API-003, OBS-001, SEC-002, QA-008]

- name: unknown-task-includes-task-scoped-mandatory
  stack: {languages: [python], frameworks: [fastapi]}
  task: ""
  environment: production
  must_include: [SEC-014, SEC-015, QA-008]

- name: terraform-security-group-and-database
  stack: {languages: [terraform], platforms: [aws, terraform]}
  task: Add a security group and a Postgres RDS instance with Terraform
  environment: production
  must_include: [AWS-004, AWS-005, AWS-009, TF-003, TF-004, TF-005, CICD-005]
  must_be_mandatory: [AWS-004, AWS-005, TF-005]
  must_exclude: [DOCKER-002, TG-001, SEC-014]

- name: terragrunt-live-unit
  stack: {languages: [hcl], platforms: [terragrunt]}
  task: Add a Terragrunt unit for the VPC in the production account
  environment: production
  must_include: [TG-001, TG-002, TG-003, TG-004, CICD-005, SEC-001]
  must_exclude: [AWS-001, DOCKER-001, PY-005]

- name: dockerfile-hardening
  stack: {languages: [python, dockerfile], platforms: [docker]}
  task: Write a Dockerfile for the worker image
  environment: development
  must_include: [DOCKER-001, DOCKER-002, DOCKER-003, DOCKER-004]
  must_be_mandatory: [DOCKER-003]
  must_exclude: [CICD-001, TG-001, AWS-004]

- name: github-actions-workflow
  stack: {languages: [yaml], platforms: [github-actions]}
  task: Add a GitHub Actions workflow that deploys on merge
  environment: staging
  must_include: [CICD-001, CICD-002, CICD-003, CICD-004]
  must_be_mandatory: [CICD-003]
  must_exclude: [DOCKER-001, TG-001, PY-012]

- name: shell-deploy-script
  stack: {languages: [shell]}
  task: Write a deploy script that installs the CLI
  environment: development
  must_include: [SH-001, SH-002, SEC-001]
  must_exclude: [DOCKER-002, CICD-001, AWS-001]

- name: kubernetes-secret-manifest
  stack: {languages: [yaml], platforms: [kubernetes]}
  task: Add database credentials to the Kubernetes deployment
  environment: production
  must_include: [K8S-004, K8S-005, K8S-001]
  must_be_mandatory: [K8S-005]
  must_exclude: [DOCKER-001, CICD-001]
